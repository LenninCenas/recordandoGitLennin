<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Números del 1 al 10</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="presentation" aria-label="Presentación de números">
  <section class="slide active" aria-label="Número 1"><span>1</span></section>
  <section class="slide" aria-label="Número 2" hidden><span>2</span></section>
  <section class="slide" aria-label="Número 3" hidden><span>3</span></section>
  <section class="slide" aria-label="Número 4" hidden><span>4</span></section>
  <section class="slide" aria-label="Número 5" hidden><span>5</span></section>
  <section class="slide" aria-label="Número 6" hidden><span>6</span></section>
  <section class="slide" aria-label="Número 7" hidden><span>7</span></section>
  <section class="slide" aria-label="Número 8" hidden><span>8</span></section>
  <section class="slide" aria-label="Número 9" hidden><span>9</span></section>
  <section class="slide" aria-label="Número 10" hidden><span>10</span></section>
  <nav class="controls" aria-label="Controles de presentación">
    <button type="button" id="previous" aria-label="Número anterior">Anterior</button>
    <span id="counter" aria-live="polite">1 / 10</span>
    <button type="button" id="next" aria-label="Número siguiente">Siguiente</button>
  </nav>
</main>
<script src="js/index.js"></script>
</body>
</html>
